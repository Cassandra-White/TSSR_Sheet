name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main  # Change en 'master' si ta branche principale s'appelle master

# Permissions nécessaires pour que l'Action déploie sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install mkdocs
          # Si tu utilises le thème Material pour MkDocs, décommente la ligne suivante :
          # pip install mkdocs-material

      - name: Build MkDocs site
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site  # MkDocs génère le site HTML dans ce dossier

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
